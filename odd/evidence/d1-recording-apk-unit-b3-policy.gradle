import org.gradle.execution.plan.Node
import org.gradle.execution.plan.TaskNode
import org.gradle.execution.taskgraph.TaskExecutionGraphInternal
import java.util.function.BiConsumer

gradle.startParameter.setOffline(true)
// B3 only: the fixed app request and its bounded, variant-scoped closure.
def appRoot = '/app/vaca_app/android'
def flutterRoot = System.getenv('FLUTTER_ROOT') + '/packages/flutter_tools/gradle'
def signer = new File('/b3/signer').canonicalFile
def approvedProjects = new groovy.json.JsonSlurper().parse(new File('/b3/projects.json')) as Set
def model = { project ->
    def variants = project.extensions.getByName('android').getApplicationVariants().findAll {
        it.getName() == 'devDebug'
    }
    if (variants.size() != 1) throw new GradleException('B3_REJECT_VARIANTS')
    def variant = variants[0]
    def signing = variant.getSigningConfig()
    if (variant.getApplicationId() != 'cl.vaca.app.dev' || signing == null ||
        signing.getName() != 'debug' || signing.getStoreFile()?.canonicalFile != signer || !signer.isFile()) {
        throw new GradleException('B3_REJECT_SIGNING_MODEL')
    }
}
gradle.beforeSettings { settings ->
    def identity = settings.settingsDir.canonicalPath
    if (!(identity in [appRoot, flutterRoot]) || !gradle.startParameter.offline) {
        throw new GradleException('B3_REJECT_SETTINGS')
    }
    if (identity == appRoot && (gradle.startParameter.taskNames != ['assembleDevDebug'] ||
        !new File('/b3/state/attempt').isDirectory())) throw new GradleException('B3_REJECT_REQUEST')
    println('B3_OFFLINE ' + (identity == appRoot ? 'app' : 'flutter'))
}
gradle.beforeProject { project ->
    if (project.rootProject.projectDir.canonicalPath == appRoot && project.path == ':app') {
        project.plugins.withId('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                def signing = dsl.signingConfigs.getByName('debug')
                signing.storeFile = signer
                signing.storePassword = 'android'
                signing.keyAlias = 'androiddebugkey'
                signing.keyPassword = 'android'
                dsl.buildTypes.getByName('debug').signingConfig = signing
            }
        }
    }
}
gradle.taskGraph.whenReady { graph ->
    def identity = gradle.rootProject.projectDir.canonicalPath
    if (identity == flutterRoot) {
        graph.allTasks.each { task ->
            if (task.project.rootProject.projectDir.canonicalPath != flutterRoot || task.project.path != ':' ||
                !(task.name in ['compileKotlin', 'compileJava', 'compileGroovy', 'pluginDescriptors',
                                'processResources', 'classes', 'jar', 'checkKotlinGradlePluginConfigurationErrors'])) {
                throw new GradleException('B3_REJECT_FLUTTER_TASK')
            }
        }
        return
    }
    if (identity != appRoot) throw new GradleException('B3_REJECT_BUILD')
    def app = gradle.rootProject.project(':app')
    if (!app.plugins.hasPlugin('com.android.application')) throw new GradleException('B3_REJECT_APP_PLUGIN')
    model(app)
    def target = app.tasks.getByName('assembleDevDebug')
    if (gradle.gradleVersion != '8.14' || !(graph instanceof TaskExecutionGraphInternal)) {
        throw new GradleException('B3_REJECT_GRAPH_API')
    }
    // The visitor locates only the exact root; neither scheduled nor entry nodes seed the walk.
    def roots = []
    graph.visitScheduledNodes({ List<Node> nodes, Set<Node> entries ->
        nodes.each { node ->
            if (node instanceof TaskNode && node.getTask().is(target)) roots.add(node)
        }
    } as BiConsumer<List<Node>, Set<Node>>)
    if (roots.size() != 1 || !graph.hasTask(target)) throw new GradleException('B3_REJECT_TARGET')
    def allowed = Collections.newSetFromMap(new IdentityHashMap())
    def parents = new IdentityHashMap()
    def edges = new IdentityHashMap()
    def taskNodes = new IdentityHashMap()
    def pending = new ArrayDeque()
    def enqueue = { Node node, Node parent, String edge ->
        if (!parents.containsKey(node)) {
            if (parents.size() >= 4096) throw new GradleException('B3_REJECT_GRAPH_SIZE')
            parents.put(node, parent)
            edges.put(node, edge)
            pending.add(node)
        }
    }
    enqueue(roots[0], null, 'root')
    while (!pending.isEmpty()) {
        Node node = pending.removeFirst()
        if (node instanceof TaskNode) {
            allowed.add(node.getTask())
            taskNodes.put(node.getTask(), node)
        }
        // Include non-Task bridges; never follow ordering, predecessor or finalizing-successor edges.
        node.getDependencySuccessors().each { enqueue(it, node, 'dependency') }
        node.getFinalizers().each { enqueue(it, node, 'finalizer') }
    }
    def allowAssetCleanup = { task ->
        if (task.path != ':app:cleanMergeDevDebugAssets' || task.project.path != ':app') return false
        if (!(task instanceof org.gradle.api.tasks.Delete) || task.actions.size() != 1) {
            throw new GradleException('B3_REJECT_ASSET_CLEANUP')
        }
        def buildArea = new File('/app/vaca_app/build/app').toPath()
        def checkedPaths = { files ->
            def paths = files.collect { file ->
                def path = file.toPath().toAbsolutePath().normalize()
                if (path != file.canonicalFile.toPath() || path == buildArea || !path.startsWith(buildArea)) {
                    throw new GradleException('B3_REJECT_ASSET_CLEANUP')
                }
                path
            } as Set
            if (paths.isEmpty()) throw new GradleException('B3_REJECT_ASSET_CLEANUP')
            paths
        }
        def merge = app.tasks.getByName('mergeDevDebugAssets')
        def expected = checkedPaths(merge.outputs.files.files)
        def validate = {
            if (task.followSymlinks || app.layout.buildDirectory.get().asFile.canonicalFile.toPath() != buildArea ||
                checkedPaths(task.targetFiles.files) != expected || checkedPaths(merge.outputs.files.files) != expected) {
                throw new GradleException('B3_REJECT_ASSET_CLEANUP')
            }
        }
        validate()
        task.doFirst { validate() }
        true
    }
    graph.allTasks.each { task ->
        def neutral = task.name in ['preBuild', 'checkKotlinGradlePluginConfigurationErrors']
        def variant = task.project.path == ':app' ? task.name.contains('DevDebug') : task.name.contains('Debug')
        def forbidden = task.name =~ /(?i)(release|profile|prod|staging|clean|publish|upload|install|uninstall|connected|test|lint)/
        def checks = [root: task.project.rootProject.projectDir.canonicalPath == appRoot,
                      project: approvedProjects.contains(task.project.path),
                      closure: allowed.contains(task), variant: neutral || variant]
        if (checks.containsValue(false)) {
            def diagnostic = [task: task.path.take(256), project: task.project.path.take(256),
                              checks: checks]
            diagnostic.graphReachable = checks.closure
            diagnostic.visited = parents.size()
            def chain = []
            Node current = taskNodes.get(task)
            while (current != null && chain.size() < 32) {
                def step = [nodeType: current.class.simpleName.take(128), edge: edges.get(current)]
                if (current instanceof TaskNode) step.task = current.getTask().path.take(256)
                chain.add(step)
                current = parents.get(current)
            }
            diagnostic.chain = chain.reverse()
            diagnostic.chainTruncated = current != null
            println('B3_TASK_DIAGNOSTIC ' + groovy.json.JsonOutput.toJson(diagnostic))
            throw new GradleException('B3_REJECT_TASK: ' + task.path)
        }
        if (forbidden.find() && !allowAssetCleanup(task)) throw new GradleException('B3_REJECT_TASK: ' + task.path)
    }
    println('B3_FINAL devDebug cl.vaca.app.dev debug /b3/signer')
}
